<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gaussian Splat Video Creator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gl"></canvas>
  <aside id="panel">
    <h1>Gaussian Splat Creator</h1>
    <p class="sub">Turn an MP4 into a simple GPU-rendered Gaussian-style splat cloud.</p>
    <label class="file"><input id="videoFile" type="file" accept="video/mp4,video/*">Choose MP4 video</label>
    <div id="videoInfo">No video loaded.</div>
    <label>Frame samples <output id="framesOut">24</output></label>
    <input id="frames" type="range" min="4" max="80" step="1" value="24">
    <label>Pixel stride <output id="strideOut">8</output></label>
    <input id="stride" type="range" min="2" max="20" step="1" value="8">
    <label>Depth spread <output id="depthOut">6.0</output></label>
    <input id="depth" type="range" min="1" max="16" step="0.5" value="6">
    <label>Splat size <output id="sizeOut">1.00</output></label>
    <input id="size" type="range" min="0.25" max="3" step="0.05" value="1">
    <div class="buttons">
      <button id="create">Create splats</button>
      <button id="clear">Clear</button>
      <button id="export">Export PLY</button>
    </div>
    <div class="stats">Splats: <b id="count">0</b><br>FPS: <b id="fps">0</b><br>Status: <b id="status">Ready</b></div>
  </aside>
  <div id="help">Drag = orbit · Shift+drag = pan · Wheel = zoom</div>
  <video id="source" muted playsinline></video>
  <canvas id="frameCanvas"></canvas>
  <script type="module" src="js/main.js"></script>
</body>
</html>
